# Roomwright static site. Its own port, alongside the other apps on this server
# (pfi on 80, praxus on 8081). Files come from GitHub Actions into releases/,
# and `current` points at the live one.
server {
    listen 8082;
    listen [::]:8082;
    server_name _;

    root /var/www/roomwright/current;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite puts a content hash in every asset filename, so these can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/catalog, /planner, …) all load index.html; never cache it,
    # so a new deploy shows up on the next visit.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
